# Dock — light theme overrides (applied on top of FlatLightLaf)

# Dock palette
Dock.accent          = #2563EB
Dock.accentText      = #FFFFFF
Dock.cardBackground  = #FFFFFF
Dock.cardBorder      = #E2E5EA
Dock.tileBackground  = #EEF1F5
Dock.fieldBackground = #FFFFFF

# Footer progress bar fill follows the app accent (keep in sync with Dock.accent)
ProgressBar.foreground = #2563EB

# Crisp flat geometry — no outer focus rings hugging the borders
Component.focusWidth        = 0
Component.innerFocusWidth   = 0
Component.arc               = 8
Button.arc                  = 8
Button.margin               = 4,14,4,14
Button.iconTextGap          = 6

# Ghost toolbar buttons (IntelliJ-style flat alpha fills; FlatLaf resolves
# these for both borderless and toolBarButton button types). The properties
# loader parses #RRGGBBAA — black overlays at 7%/11% alpha (IntelliJ values).
Button.toolbar.hoverBackground   = #00000012
Button.toolbar.pressedBackground = #0000001D

TitlePane.height            = 40
TabbedPane.tabHeight        = 34
Table.rowHeight             = 30
Table.alternateRowColor     = #F7F8FA
Table.cellMargins           = 2,10,2,10
Table.intercellSpacing      = 0,0
ScrollBar.width             = 12
ScrollBar.showButtons       = false
ToolBar.spacingInsets       = 4,4,4,4
MenuItem.acceleratorGap     = 24

# File-type icon hues (per group; folders keep Dock.accent)
Dock.share            = #0E7490
Dock.fileImage        = #6F42C1
Dock.fileVideo        = #C2410C
Dock.fileAudio        = #0369A1
Dock.fileDoc          = #0F766E
Dock.fileCode         = #15803D
Dock.fileArchive      = #B45309
Dock.fileBinary       = #BE123C
Dock.fileLog          = #64748B

# The tint on the ".." row while an archive is mounted in it — the
# virtual, read-only view cue (#RRGGBBAA, painted translucent over the
# table right after the cells).
Dock.archiveRowTint   = #B4530926

# The marker behind the letters a speed search matched in each file name —
# the browser's find-in-page cue (#RRGGBBAA, painted under the text).
Dock.searchHit        = #FFD33DB0

# The image viewer's well — a shade off pure white, so photos read as
# sitting in a frame rather than on the UI itself.
Dock.viewerBackground = #EEF1F5

# The player's letterbox. Video convention is a near-black well in BOTH
# themes — the film reads against cinema black, not against the UI — so
# the same value ships twice rather than following the Laf. (Deliberately
# not the dark viewerBackground literal: this key is theme-invariant.)
Dock.playerSurface    = #0B0E14

# The chip background behind inline and fenced code — one step below
# the reading surface, which is the Laf's own text-surface color.
Dock.mdCodeBackground = #F0F1F4

# The code-token palette, anchored to VS Code's Light+ hues — the
# counterpart of the dark theme's Dark+ set. Named code* so the future
# code viewer inherits these keys unchanged.
Dock.codeKeyword  = #0000FF
Dock.codeType     = #267F99
Dock.codeString   = #A31515
Dock.codeComment  = #008000
Dock.codeNumber   = #098658
Dock.codeFunction = #795E26

# The editor's changed-line bar in the gutter (VS Code's green mark);
# deliberately darker than the codeComment green — it is a status, not ink.
Dock.editChanged  = #1A7F37
