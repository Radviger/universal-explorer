# Dock — dark theme overrides (applied on top of FlatDarkLaf)

# Dock palette
Dock.accent          = #7AA2F7
Dock.accentText      = #0B0E14
Dock.cardBackground  = #474B50
Dock.cardBorder      = #565A5F
Dock.tileBackground  = #3F4348
Dock.fieldBackground = #45484D

# Footer progress bar fill follows the app accent (keep in sync with Dock.accent)
ProgressBar.foreground = #7AA2F7

# File-type icon hues (per group; folders keep Dock.accent)
Dock.share            = #89DDF7
Dock.fileImage        = #BB9AF7
Dock.fileVideo        = #FF9E64
Dock.fileAudio        = #7DCFFF
Dock.fileDoc          = #73DACA
Dock.fileCode         = #9ECE6A
Dock.fileArchive      = #E0AF68
Dock.fileBinary       = #F7768E
Dock.fileLog          = #A9B1D6

# The tint on the ".." row while an archive is mounted in it — the
# virtual, read-only view cue (#RRGGBBAA, painted translucent over the
# table right after the cells).
Dock.archiveRowTint   = #E0AF6822

# The image viewer's well — darker than any panel, so photos read as
# sitting in a frame rather than on the UI itself.
Dock.viewerBackground = #0B0E14

# The player's letterbox. Video convention is a near-black well in BOTH
# themes — the film reads against cinema black, not against the UI — so
# the same value ships twice rather than following the Laf.
Dock.playerSurface    = #0B0E14

# The chip background behind inline and fenced code — one step below
# the reading surface, which is the Laf's own text-surface color, so
# the page reads as part of the app instead of a near-black sheet.
Dock.mdCodeBackground = #36393D

# The code-token palette, anchored to VS Code's Dark+ hues every dev
# already reads fluently. Named code*, not md*, so the future code
# viewer inherits these keys unchanged. Missing-key readers fall back
# to plain foreground ink.
Dock.codeKeyword  = #569CD6
Dock.codeType     = #4EC9B0
Dock.codeString   = #CE9178
Dock.codeComment  = #6A9955
Dock.codeNumber   = #B5CEA8
Dock.codeFunction = #DCDCAA

# The editor's changed-line bar in the gutter (VS Code's green mark);
# deliberately brighter than the codeComment green — it is a status, not ink.
Dock.editChanged  = #3FB950

# Crisp flat geometry — no outer focus rings hugging the borders
Component.focusWidth        = 0
Component.innerFocusWidth   = 0
Component.arc               = 8
Button.arc                  = 8
Button.margin               = 4,14,4,14
Button.iconTextGap          = 6

# Ghost toolbar buttons (IntelliJ-style flat alpha fills; FlatLaf resolves
# these for both borderless and toolBarButton button types). The properties
# loader parses #RRGGBBAA — white overlays at 9%/15% alpha (IntelliJ values).
Button.toolbar.hoverBackground   = #FFFFFF16
Button.toolbar.pressedBackground = #FFFFFF26

TitlePane.height            = 40
TabbedPane.tabHeight        = 34
Table.rowHeight             = 30
Table.alternateRowColor     = #41454B
Table.cellMargins           = 2,10,2,10
Table.intercellSpacing      = 0,0
ScrollBar.width             = 12
ScrollBar.showButtons       = false
ToolBar.spacingInsets       = 4,4,4,4
MenuItem.acceleratorGap     = 24
